[package]
name = "timigs-linux32"
version = "1.0.0"
description = "TimiGS - Activity Tracker (Linux 32-bit Legacy)"
authors = ["you"]
edition = "2021"

[lib]
name = "timigs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.1", features = [] }
dotenv = "0.15"

[dependencies]
# Core Tauri - базові функції
tauri = { version = "2.1", features = [], default-features = false }
tauri-plugin-shell = "2.1"
tauri-plugin-fs = "2.1"
tauri-plugin-dialog = "2.1"

# Базові залежності
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
dirs = "5.0"
once_cell = "1.19"
parking_lot = "0.12"
urlencoding = "2"
csv = "1.4.0"
lazy_static = "1.4"

# Спрощені версії для сумісності зі старими системами
tokio = { version = "1", features = ["rt", "sync", "time"], default-features = false }
tiny_http = "0.12"
url = "2.5"
opener = "0.7"
mime_guess = "2.0.5"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2.1", features = ["tray-icon", "image-png"] }
tauri-plugin-cli = "2.1"
# Автозапуск та оновлення вимкнені для 32-бітних систем
# tauri-plugin-autostart = "2.1"
# tauri-plugin-updater = "2.1"

[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.20.0"
webkit2gtk = { version = "2.0", features = ["osx"] }
gtk = "0.18"

[dev-dependencies]

# Примітка: Наступні функції ВИМКНЕНІ для Linux 32-bit версії:
# - tauri-plugin-autostart (може не підтримуватися)
# - tauri-plugin-updater (може не підтримуватися)
# - rodio (аудіо може не працювати на старих системах)
# - P2P синхронизація (вимагає сучасні мережеві API)
