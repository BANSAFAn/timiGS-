[package]
name = "timigs-macos-x64"
version = "1.0.0"
description = "TimiGS - Activity Tracker (macOS Intel/x64)"
authors = ["you"]
edition = "2021"

[lib]
name = "timigs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.1", features = [] }
dotenv = "0.15"

[dependencies]
# Core Tauri
tauri = { version = "2.1", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.1"
tauri-plugin-shell = "2.1"
tauri-plugin-process = "2.1"
tauri-plugin-deep-link = "2.1"
tauri-plugin-fs = "2.1"
tauri-plugin-dialog = "2.1"

# Базові залежності
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
image = "0.25"
tiny_http = "0.12"
url = "2.5"
dirs = "5.0"
tokio = { version = "1", features = ["full"] }
once_cell = "1.19"
parking_lot = "0.12"
opener = "0.7"
urlencoding = "2"
mime_guess = "2.0.5"
rodio = "0.20"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
csv = "1.4.0"
lazy_static = "1.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2.1", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.1"
tauri-plugin-cli = "2.1"
tauri-plugin-updater = "2.1"
tauri-plugin-notification = "2.1"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"

[dev-dependencies]
