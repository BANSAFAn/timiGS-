name: Legacy Builds

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'legacy-builds/**'
      - '.github/workflows/legacy-builds.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'legacy-builds/**'
      - '.github/workflows/legacy-builds.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: true
        default: '1.3.0'

jobs:
  build-win32:
    name: Build Windows 32-bit (Win7+)
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build frontend
        run: pnpm run build

      - name: Build Win32 version
        run: |
          Copy-Item legacy-builds\win32\tauri.conf.json src-tauri\tauri.conf.json -Force
          
          cd src-tauri
          cargo tauri build --target i686-pc-windows-msvc

      - name: Upload Win32 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: timigs-win32
          path: |
            src-tauri/target/i686-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/i686-pc-windows-msvc/release/bundle/msi/*.msi

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/i686-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/i686-pc-windows-msvc/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-winxp:
    name: Build Windows XP/2000 (Legacy)
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build frontend
        run: pnpm run build

      - name: Build WinXP version
        run: |
          Copy-Item legacy-builds\winxp\tauri.conf.json src-tauri\tauri.conf.json -Force
          Copy-Item legacy-builds\winxp\Cargo.toml src-tauri\Cargo.toml -Force
          
          $env:RUSTFLAGS = "-C target-feature=+crt-static"
          
          cd src-tauri
          cargo tauri build --target i686-pc-windows-msvc

      - name: Upload WinXP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: timigs-winxp
          path: |
            src-tauri/target/i686-pc-windows-msvc/release/bundle/nsis/*.exe

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/i686-pc-windows-msvc/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux32:
    name: Build Linux 32-bit (Legacy)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            gcc-multilib \
            g++-multilib

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build frontend
        run: pnpm run build

      - name: Build Linux 32-bit version
        run: |
          cp legacy-builds/linux32/tauri.conf.json src-tauri/tauri.conf.json
          cp legacy-builds/linux32/Cargo.toml src-tauri/Cargo.toml
          
          cd src-tauri
          cargo tauri build --target i686-unknown-linux-gnu

      - name: Upload Linux 32-bit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: timigs-linux32
          path: |
            src-tauri/target/i686-unknown-linux-gnu/release/bundle/deb/*.deb
            src-tauri/target/i686-unknown-linux-gnu/release/bundle/rpm/*.rpm
            src-tauri/target/i686-unknown-linux-gnu/release/bundle/appimage/*.AppImage

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/i686-unknown-linux-gnu/release/bundle/deb/*.deb
            src-tauri/target/i686-unknown-linux-gnu/release/bundle/rpm/*.rpm
            src-tauri/target/i686-unknown-linux-gnu/release/bundle/appimage/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-x64:
    name: Build macOS Intel (x64)
    runs-on: macos-13
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build frontend
        run: pnpm run build

      - name: Build macOS x64 version
        run: |
          cp legacy-builds/macos-x64/tauri.conf.json src-tauri/tauri.conf.json
          cp legacy-builds/macos-x64/Cargo.toml src-tauri/Cargo.toml
          
          cd src-tauri
          cargo tauri build --target x86_64-apple-darwin

      - name: Upload macOS x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: timigs-macos-x64
          path: |
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-legacy-manifest:
    name: Create Legacy Builds Manifest
    runs-on: ubuntu-latest
    needs: [build-win32, build-winxp, build-linux32, build-macos-x64]
    if: github.event_name == 'release'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create manifest
        run: |
          cat > legacy-manifest.json << EOF
          {
            "version": "${{ github.event.release.tag_name }}",
            "builds": {
              "win32": {
                "name": "Windows 32-bit (Win7+)",
                "platforms": ["Windows 7", "Windows 8", "Windows 8.1", "Windows 10 (32-bit)"],
                "architecture": "i686",
                "features": {
                  "activity_tracking": true,
                  "auto_updates": true,
                  "discord_presence": false,
                  "p2p_sync": true,
                  "music_player": true
                }
              },
              "winxp": {
                "name": "Windows XP/2000 (Legacy)",
                "platforms": ["Windows XP SP3", "Windows 2000 SP4"],
                "architecture": "i686",
                "features": {
                  "activity_tracking": true,
                  "auto_updates": false,
                  "discord_presence": false,
                  "p2p_sync": false,
                  "music_player": false
                },
                "notes": [
                  "Limited functionality",
                  "Requires .NET Framework 2.0+",
                  "May require Visual C++ Redistributable (x86)"
                ]
              },
              "linux32": {
                "name": "Linux 32-bit (Legacy)",
                "platforms": ["Ubuntu 18.04+", "Debian 9+", "Fedora 28+"],
                "architecture": "i686",
                "features": {
                  "activity_tracking": true,
                  "auto_updates": false,
                  "discord_presence": false,
                  "p2p_sync": false,
                  "music_player": false
                },
                "notes": [
                  "Requires GTK 3 and WebKit2GTK",
                  "May require additional libraries on older distributions"
                ]
              },
              "macos-x64": {
                "name": "macOS Intel (x64)",
                "platforms": ["macOS 10.15+", "macOS 11", "macOS 12", "macOS 13"],
                "architecture": "x86_64",
                "features": {
                  "activity_tracking": true,
                  "auto_updates": true,
                  "discord_presence": false,
                  "p2p_sync": true,
                  "music_player": true
                },
                "notes": [
                  "For Intel-based Macs only",
                  "Not compatible with Apple Silicon (use universal or arm64 version)"
                ]
              }
            },
            "release_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload manifest to release
        uses: softprops/action-gh-release@v1
        with:
          files: legacy-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
